name: Update Shiller data

on:
  schedule:
    - cron: "30 6 * * *"   # daglig kl. 06:30 UTC; skriptet hopper over hvis filen er uendret
  workflow_dispatch: {}     # lar deg kjore manuelt fra Actions-fanen

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts (Arial-compatible)
        run: sudo apt-get update -y && sudo apt-get install -y fonts-liberation

      - name: Install dependencies
        run: pip install pandas numpy requests xlrd matplotlib

      - name: Fetch and clean latest Shiller file
        run: python update_shiller.py --out data

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit if data changed
        run: |
          if [ -n "$(git status --porcelain data docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data docs
            git commit -m "Update Shiller data and dashboard"
            git push
          else
            echo "No changes."
          fi
